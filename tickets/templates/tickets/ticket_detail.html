
{% extends "base.html" %}

{% block title %}{{ ticket.title }} | Mini Helpdesk{% endblock %}

{% block content %}
    <h1>{{ ticket.title }}</h1>

    <p>{{ ticket.description }}</p>
    <p>Status: {{ ticket.get_status_display }}</p>
    <p>Utworzono: {{ ticket.created_at|date:"d.m.Y H:i" }}</p>

    <a href="{% url 'ticket_list' %}">Powrót do listy</a>
{% endblock %}
